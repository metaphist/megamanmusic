<html lang="en">

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Robot Master Song Profile</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/robot-master.css">

<body>
  <div class="wrap">
    <header>
      <div class="titlebar">
        <div class="ttl">
          <a class="eyebrow backlink" href="./" data-testid="home-link">← All robot masters</a>
          <h1>Robot Master Song Profile</h1>
        </div>
        <div class="pick rm-pick">
          <label class="plabel" for="rmPick">Quick switch</label>
          <div class="rm-find">
            <input type="text" id="rmPick" class="fld" data-testid="rm-pick" autocomplete="off" spellcheck="false"
              role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="rmPickList">
            <ul id="rmPickList" role="listbox" aria-label="Robot masters" hidden></ul>
          </div>
        </div>
        <div class="tbtns">
          <button type="button" class="themetoggle" id="themeToggle" aria-label="Switch to dark mode">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor"
                d="M6 2h8v2h-2v2h-2V4H6V2ZM4 6V4h2v2H4Zm0 10H2V6h2v10Zm2 2H4v-2h2v2Zm2 2H6v-2h2v2Zm10 0v2H8v-2h10Zm2-2v2h-2v-2h2Zm-2-4h2v4h2v-8h-2v2h-2v2Zm-6 0v2h6v-2h-6Zm-2-2h2v2h-2v-2Zm0 0V6H8v6h2Z" />
            </svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor"
                d="M11 1h2v3h-2V1Zm-2 6h6v2H9V7Zm6 2h2v6h-2V9Zm-6 6h6v2H9v-2ZM7 9h2v6H7V9Zm4 11h2v3h-2v-3ZM1 11h3v2H1v-2Zm19 0h3v2h-3v-2ZM4 4h2v2H4V4Zm2 2h2v2H6V6Zm12-2h2v2h-2V4Zm-2 2h2v2h-2V6ZM4 18h2v2H4v-2Zm2-2h2v2H6v-2Zm12 2h2v2h-2v-2Zm-2-2h2v2h-2v-2Z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="profile" class="rm" aria-live="polite"></main>

    <footer class="site-foot">
      <p class="credit" data-testid="capcom-credit">All Mega Man music and artwork on this page is &copy; Capcom Co., Ltd. This is an unofficial fan site, not affiliated with or endorsed by Capcom.</p>
    </footer>
  </div>
  <audio id="player" preload="none"></audio>
  <script type="module" src="src/robot-master.js"></script>
</body>

</html>
