<!doctype html>
<html lang="en">

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Robot Master Profile</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="robot-master.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
</head>

<body>
  <div class="wrap">
    <header>
      <div class="titlebar">
        <label class="pick rm-pick"><span class="plabel">Robot master</span><select id="rmPick"
            data-testid="rm-pick"></select></label>
        <div class="tbtns">
          <a class="themetoggle" href="tiers.html" aria-label="Tier list"><span class="tlabel">Tiers</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 4h18v4H3V4Zm0 6h13v4H3v-4Zm0 6h8v4H3v-4Z" /></svg>
          </a>
          <a class="themetoggle" href="./" aria-label="Back to the color project">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M11 3h2v2h2v2h2v2h2v2h2v2h-2v8h-5v-6h-4v6H5v-8H3v-2h2V9h2V7h2V5h2V3z" />
            </svg>
            <span class="tlabel">Home</span>
          </a>
          <button type="button" class="themetoggle" id="themeToggle" aria-label="Switch to dark mode">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor"
                d="M6 2h8v2h-2v2h-2V4H6V2ZM4 6V4h2v2H4Zm0 10H2V6h2v10Zm2 2H4v-2h2v2Zm2 2H6v-2h2v2Zm10 0v2H8v-2h10Zm2-2v2h-2v-2h2Zm-2-4h2v4h2v-8h-2v2h-2v2Zm-6 0v2h6v-2h-6Zm-2-2h2v2h-2v-2Zm0 0V6H8v6h2Z" />
            </svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor"
                d="M11 1h2v3h-2V1Zm-2 6h6v2H9V7Zm6 2h2v6h-2V9Zm-6 6h6v2H9v-2ZM7 9h2v6H7V9Zm4 11h2v3h-2v-3ZM1 11h3v2H1v-2Zm19 0h3v2h-3v-2ZM4 4h2v2H4V4Zm2 2h2v2H6V6Zm12-2h2v2h-2V4Zm-2 2h2v2h-2V6ZM4 18h2v2H4v-2Zm2-2h2v2H6v-2Zm12 2h2v2h-2v-2Zm-2-2h2v2h-2v-2Z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="profile" class="rm" aria-live="polite"></main>
  </div>
  <audio id="player" preload="none"></audio>
  <script type="module" src="src/robot-master.js"></script>
</body>

</html>
